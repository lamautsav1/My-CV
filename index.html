<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1220">
  <meta name="description" content="Meet Utsav Lama, an IT &amp; Application Support Specialist supporting business applications, internal users, branch operations, functional testing, and UAT in Kathmandu, Nepal.">
  <title>Utsav Lama | IT &amp; Application Support Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B1220'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' font-weight='700' fill='%233B82F6'%3EUL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7fb;
      --muted: #9aa9bd;
      --faint: #6f8098;
      --navy: #0B1220;
      --panel: #111c2d;
      --panel-soft: #142236;
      --line: rgba(180, 200, 225, .14);
      --blue: #3B82F6;
      --teal: #14B8A6;
      --font-heading: "Space Grotesk", "Trebuchet MS", sans-serif;
      --font-body: "Inter", "Segoe UI", sans-serif;
      --content-width: 1120px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: auto; scroll-padding-top: 92px; }
    body {
      margin: 0;
      background: var(--navy);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 4px;
    }
    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      transform: translateY(-150%);
      background: var(--ink);
      color: var(--navy);
      border-radius: 4px;
    }
    .skip-link:focus { transform: translateY(0); }
    .wrap { width: min(var(--content-width), calc(100% - 48px)); margin-inline: auto; }
    .site-header {
      position: sticky;
      z-index: 25;
      top: 0;
      border-bottom: 1px solid rgba(180, 200, 225, .09);
      background: rgba(11, 18, 32, .88);
      backdrop-filter: blur(16px);
    }
    .nav-row { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; flex-shrink: 0; font-family: var(--font-heading); font-weight: 700; }
    .brand-mark {
      display: grid;
      width: 36px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(59, 130, 246, .5);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(59, 130, 246, .2), rgba(20, 184, 166, .1));
      color: #8eb9ff;
      font-size: 13px;
    }
    .nav-links { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2vw, 27px); }
    .nav-links a { position: relative; padding: 8px 0; color: var(--muted); font-size: 12px; transition: color .2s ease; }
    .nav-links a::after { position: absolute; right: 0; bottom: 1px; left: 0; height: 2px; background: var(--teal); content: ""; transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links a.active::after { transform: scaleX(1); }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 600;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      cursor: pointer;
    }
    .button:hover { transform: translateY(-2px); background: #5591f7; }
    .button-outline { border-color: var(--line); background: rgba(255,255,255,.025); color: var(--ink); }
    .button-outline:hover { border-color: rgba(20, 184, 166, .65); background: rgba(20, 184, 166, .08); }
    .button-small { min-height: 38px; padding-inline: 13px; font-size: 12px; }
    .nav-download { flex-shrink: 0; }
    .menu-toggle { display: none; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
    .menu-toggle svg { width: 19px; }
    .scroll-progress { position: fixed; z-index: 60; top: 0; left: 0; width: 100%; height: 3px; background: var(--blue); transform: scaleX(0); transform-origin: left center; pointer-events: none; }
    .custom-cursor { position: fixed; z-index: 70; top: 0; left: 0; display: none; border-radius: 50%; pointer-events: none; }
    .cursor-dot { width: 6px; height: 6px; background: var(--teal); }
    .cursor-ring { width: 34px; height: 34px; border: 1px solid rgba(59,130,246,.7); }
    body.custom-cursor-enabled .custom-cursor { display: block; }
    body.custom-cursor-enabled, body.custom-cursor-enabled a, body.custom-cursor-enabled button { cursor: none; }

    .hero {
      position: relative;
      display: grid;
      min-height: max(540px, calc(100svh - 76px));
      align-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 78% 48%, rgba(31, 79, 124, .22), transparent 38%),
        linear-gradient(115deg, rgba(11,18,32,1) 45%, rgba(12,24,41,.88));
    }
    .hero::before {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(160,190,220,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(160,190,220,.035) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: linear-gradient(90deg, transparent, black 78%);
      content: "";
      pointer-events: none;
    }
    .hero-inner { position: relative; display: grid; min-height: inherit; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); align-items: center; gap: 52px; padding-block: 88px; }
    .hero-copy { position: relative; z-index: 2; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 20px; color: #76d7cc; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
    .eyebrow::before { width: 24px; height: 1px; background: var(--teal); content: ""; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--font-heading); letter-spacing: 0; }
    h1 { max-width: 690px; margin-bottom: 20px; font-size: clamp(46px, 7vw, 78px); line-height: 1.03; font-weight: 700; }
    .hero-title { display: block; margin-top: 13px; color: #9fc2fa; font-size: .43em; line-height: 1.3; font-weight: 500; }
    .hero-tagline { max-width: 580px; margin-bottom: 29px; color: #b7c4d5; font-size: 17px; line-height: 1.75; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-meta { display: flex; align-items: center; gap: 8px; margin-top: 34px; color: var(--muted); font-size: 12px; }
    .hero-meta svg { width: 15px; color: var(--teal); }
    .hero-cinematic { position: fixed; z-index: 30; inset: 0; visibility: hidden; overflow: hidden; color: white; pointer-events: none; }
    body.gsap-ready .hero-cinematic { visibility: visible; }
    .cinematic-glow { position: absolute; top: 50%; left: 50%; width: min(78vw, 900px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,.27), rgba(59,130,246,.08) 45%, transparent 72%); opacity: 0; translate: -50% -50%; }
    .cinematic-wipe { position: absolute; top: 50%; left: 50%; width: 150vmax; height: 150vmax; border-radius: 50%; background: var(--blue); opacity: 0; translate: -50% -50%; }
    .cinematic-content { position: absolute; inset: 0; display: grid; place-items: center; }
    .cinematic-name-wrap { position: relative; width: max-content; max-width: 94vw; transform-origin: center; text-align: center; white-space: nowrap; }
    .cinematic-name, .cinematic-outline { display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: clamp(52px, 11vw, 150px); font-weight: 700; line-height: .95; text-transform: uppercase; }
    .cinematic-name { position: relative; color: var(--ink); }
    .cinematic-outline { position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 1px rgba(98,157,255,.95); opacity: 0; }
    .cinematic-letter { display: inline-block; will-change: transform, opacity; }
    .cinematic-space { width: .28em; }
    .cinematic-role { position: absolute; top: calc(50% + clamp(46px, 9vw, 92px)); margin: 0; color: #c5d7f0; font-size: clamp(13px, 1.7vw, 18px); letter-spacing: .08em; opacity: 0; }
    .cinematic-scroll { position: absolute; bottom: max(35px, 7vh); display: grid; justify-items: center; gap: 4px; color: rgba(235,244,255,.76); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; opacity: 0; }
    .cinematic-scroll svg { width: 17px; height: 17px; animation: scroll-bounce 1.5s ease-in-out infinite; }
    .cinematic-ul { position: fixed; top: 0; left: 0; color: white; font: 700 13px var(--font-heading); opacity: 0; }
    @keyframes scroll-bounce { 50% { transform: translateY(5px); } }
    .portrait-stage { position: relative; display: grid; min-height: 360px; place-items: center; }
    .portrait-frame {
      position: relative;
      z-index: 1;
      width: min(290px, 80%);
      aspect-ratio: 1;
      padding: 10px;
      border: 1px solid rgba(111, 159, 226, .38);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(59,130,246,.16), rgba(20,184,166,.1));
      box-shadow: 0 22px 100px rgba(0,0,0,.32), 0 0 0 18px rgba(255,255,255,.018);
    }
    .portrait-frame img { width: 100%; height: 100%; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; object-fit: cover; background: var(--panel); }
    .portrait-fallback { display: none; width: 100%; height: 100%; place-items: center; border-radius: 50%; background: linear-gradient(145deg, #172c49, #123b45); color: #c8defe; font: 700 70px var(--font-heading); }
    .portrait-frame img:not([src]), .portrait-frame img[src=""] { display: none; }
    .portrait-frame img.is-broken { display: none; }
    .portrait-frame img.is-broken + .portrait-fallback { display: grid; }
    .orbit-square { position: absolute; width: 66px; height: 66px; border: 1px solid rgba(20,184,166,.35); border-radius: 14px; transform: rotate(24deg); animation: drift 8s ease-in-out infinite; }
    .orbit-square.one { top: 9%; right: 8%; }
    .orbit-square.two { bottom: 12%; left: 8%; width: 40px; height: 40px; border-color: rgba(59,130,246,.5); border-radius: 9px; animation-delay: -3s; }
    .orbit-ring { position: absolute; top: 50%; left: 50%; width: 350px; height: 350px; border: 1px dashed rgba(151,180,218,.14); border-radius: 50%; transform: translate(-50%,-50%); }
    @keyframes drift { 50% { transform: translateY(-12px) rotate(34deg); } }

    .section { padding-block: 104px; border-bottom: 1px solid rgba(180,200,225,.09); }
    .section-soft { background: rgba(255,255,255,.018); }
    .section-heading { max-width: 650px; margin-bottom: 46px; }
    .section-kicker { margin-bottom: 10px; color: var(--teal); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    h2 { margin-bottom: 10px; font-size: clamp(32px, 4vw, 44px); line-height: 1.16; }
    .section-lead { margin-bottom: 0; color: var(--muted); font-size: 14px; }
    .about-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 72px; align-items: start; }
    .about-copy { color: #bdc8d7; font-size: 15px; }
    .about-copy p:last-child { margin-bottom: 0; }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .fact { min-height: 93px; padding: 17px 19px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .fact-label { display: block; margin-bottom: 6px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .fact-value { color: var(--ink); font-size: 13px; font-weight: 500; }

    .timeline { position: relative; display: grid; gap: 28px; margin-left: 8px; padding-left: 33px; border-left: 1px solid rgba(91,139,202,.13); }
    .timeline-progress-line { position: absolute; top: 0; left: -1px; width: 1px; height: 100%; background: var(--teal); transform: scaleY(0); transform-origin: top; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 3px 0 8px; }
    .timeline-item::before { position: absolute; top: 7px; left: -39px; width: 11px; height: 11px; border: 2px solid var(--teal); border-radius: 50%; background: var(--navy); content: ""; box-shadow: 0 0 0 5px rgba(20,184,166,.08); }
    .timeline-item h3 { margin-bottom: 5px; font-size: 19px; }
    .timeline-subtitle { margin-bottom: 10px; color: #9fc2fa; font-size: 13px; font-weight: 500; }
    .timeline-subtitle a, .timeline-copy a { color: inherit; transition: color .2s ease; }
    .timeline-subtitle a:hover, .timeline-copy a:hover { color: var(--blue); }
    .timeline-subtitle a:focus-visible, .timeline-copy a:focus-visible { color: var(--teal); }
    .timeline-copy { max-width: 710px; margin-bottom: 13px; color: var(--muted); font-size: 13px; }
    .timeline-date { padding-top: 3px; color: #81d9cf; font-size: 12px; white-space: nowrap; }
    .responsibilities { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .responsibilities li { position: relative; padding-left: 18px; color: #b7c4d5; font-size: 13px; }
    .responsibilities li::before { position: absolute; top: 10px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); content: ""; }

    .skills-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; }
    .skill-card { display: flex; min-height: 158px; flex-direction: column; justify-content: space-between; padding: 21px; border: 1px solid var(--line); border-radius: 7px; background: linear-gradient(150deg, rgba(20,34,54,.85), rgba(17,28,45,.45)); transition: transform .22s ease, border-color .22s ease, background .22s ease; }
    .skill-card:hover { transform: translateY(-5px); border-color: rgba(20,184,166,.45); background: linear-gradient(150deg, rgba(23,48,67,.9), rgba(17,28,45,.7)); }
    .skill-icon { display: grid; width: 37px; height: 37px; place-items: center; border: 1px solid rgba(59,130,246,.25); border-radius: 7px; background: rgba(59,130,246,.1); color: #81b0ff; }
    .skill-icon svg { width: 18px; height: 18px; }
    .skill-card h3 { max-width: 190px; margin: 18px 0 0; font-size: 14px; line-height: 1.45; }

    .project-grid { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 560px; }
    .project-card { position: relative; overflow: hidden; padding: 27px; border: 1px solid var(--line); border-radius: 7px; background: linear-gradient(135deg, rgba(20,34,54,.94), rgba(17,28,45,.74)); transition: transform .22s ease, border-color .22s ease; }
    .project-card::after { position: absolute; top: -44px; right: -34px; width: 140px; height: 140px; border: 1px solid rgba(20,184,166,.17); border-radius: 40px; transform: rotate(25deg); content: ""; pointer-events: none; }
    .project-card:hover { transform: translateY(-4px); border-color: rgba(59,130,246,.5); }
    .project-type { margin-bottom: 15px; color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .project-card h3 { margin-bottom: 9px; font-size: 22px; }
    .project-card p { max-width: 450px; margin-bottom: 20px; color: var(--muted); font-size: 13px; }
    .project-card .button { position: relative; z-index: 1; }

    .award-card { display: flex; align-items: center; gap: 20px; padding: 23px 25px; border: 1px dashed rgba(112,151,198,.33); border-radius: 7px; background: rgba(17,28,45,.48); }
    .award-icon { display: grid; width: 46px; height: 46px; flex-shrink: 0; place-items: center; border-radius: 8px; background: rgba(20,184,166,.1); color: #54d4c6; }
    .award-icon svg { width: 22px; }
    .award-card p { margin: 0; color: #b3c1d2; font-size: 13px; }

    .contact-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 76px; align-items: start; }
    .contact-intro { margin-bottom: 27px; color: var(--muted); font-size: 14px; }
    .contact-list { display: grid; gap: 14px; }
    .contact-link { display: flex; align-items: center; gap: 13px; color: #d5deea; font-size: 13px; transition: color .2s ease; }
    .contact-link:hover { color: #82b1ff; }
    .contact-icon { display: grid; width: 38px; height: 38px; flex-shrink: 0; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: var(--teal); }
    .contact-icon svg { width: 17px; height: 17px; }
    .contact-form { display: grid; gap: 15px; padding: 25px; border: 1px solid var(--line); border-radius: 7px; background: rgba(17,28,45,.62); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .field label { color: #c5d1df; font-size: 11px; font-weight: 600; }
    .field input, .field textarea { width: 100%; border: 1px solid rgba(180,200,225,.16); border-radius: 5px; background: #0d1726; color: var(--ink); font-size: 13px; transition: border-color .2s ease; }
    .field input { height: 43px; padding: 0 12px; }
    .field textarea { min-height: 120px; padding: 11px 12px; resize: vertical; }
    .field input:focus, .field textarea:focus { border-color: var(--teal); outline: none; }
    .field input::placeholder, .field textarea::placeholder { color: #61738b; }
    .form-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .form-note { margin: 0; color: var(--faint); font-size: 10px; }

    .site-footer { padding-block: 23px; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--faint); font-size: 11px; }
    .footer-row p { margin: 0; }
    .back-top { display: inline-flex; align-items: center; gap: 7px; color: #b9c7d7; transition: color .2s ease; }
    .back-top:hover { color: var(--teal); }
    .back-top svg { width: 15px; }

    body.gsap-ready .hero-inner { opacity: 0; }
    body.gsap-ready .reveal { opacity: 0; transform: translateY(22px); }
    .word-mask { display: inline-block; overflow: hidden; margin-right: .22em; padding-bottom: .08em; vertical-align: bottom; }
    .word-inner, .line-inner { display: inline-block; will-change: transform, opacity; }
    .line-mask { display: block; overflow: hidden; padding-bottom: .08em; }
    .cinematic-button:hover { transform: none; }

    @media (max-width: 900px) {
      .nav-links { gap: 13px; }
      .nav-links a { font-size: 11px; }
      .hero-inner { gap: 25px; }
      .about-grid, .contact-grid { gap: 42px; }
      .skills-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 700px) {
      html { scroll-padding-top: 72px; }
      .wrap { width: min(var(--content-width), calc(100% - 36px)); }
      .nav-row { min-height: 66px; gap: 10px; }
      .brand { font-size: 13px; }
      .brand-mark { width: 32px; border-radius: 8px; }
      .menu-toggle { display: grid; margin-left: auto; }
      .nav-download { min-height: 38px; padding-inline: 10px; font-size: 11px; }
      .nav-links { position: absolute; top: calc(100% + 1px); right: 0; left: 0; display: none; align-items: stretch; gap: 0; padding: 8px 18px 14px; border-bottom: 1px solid var(--line); background: rgba(11,18,32,.97); }
      .nav-links.is-open { display: grid; }
      .nav-links a { padding: 10px 2px; font-size: 13px; }
      .nav-links a::after { display: none; }
      body.custom-cursor-enabled, body.custom-cursor-enabled a, body.custom-cursor-enabled button { cursor: auto; }
      body.custom-cursor-enabled .custom-cursor { display: none; }
      .hero { min-height: calc(100svh - 66px); }
      .hero-inner { grid-template-columns: 1fr; gap: 11px; padding-block: 69px 54px; }
      .hero-copy { order: 1; }
      .portrait-stage { order: 0; min-height: 205px; }
      .portrait-frame { width: 164px; padding: 7px; }
      .orbit-ring { width: 205px; height: 205px; }
      .orbit-square.one { top: 7%; right: 23%; width: 42px; height: 42px; }
      .orbit-square.two { bottom: 10%; left: 21%; width: 31px; height: 31px; }
      .eyebrow { margin-bottom: 15px; }
      h1 { margin-bottom: 14px; font-size: clamp(43px, 12vw, 63px); }
      .hero-title { margin-top: 9px; font-size: .43em; }
      .hero-tagline { margin-bottom: 21px; font-size: 15px; }
      .hero-meta { margin-top: 23px; }
      .cinematic-name, .cinematic-outline { font-size: clamp(44px, 12vw, 82px); }
      .cinematic-role { top: calc(50% + 37px); font-size: 12px; }
      .cinematic-scroll { bottom: 35px; }
      .section { padding-block: 72px; }
      .section-heading { margin-bottom: 31px; }
      .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 29px; }
      .facts { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .timeline { gap: 22px; }
      .timeline-item { grid-template-columns: 1fr; gap: 3px; }
      .timeline-date { grid-row: 1; }
      .skills-grid { gap: 10px; }
      .skill-card { min-height: 138px; padding: 16px; }
      .skill-card h3 { font-size: 12px; }
      .contact-form { padding: 18px; }
    }
    @media (max-width: 390px) {
      .wrap { width: calc(100% - 28px); }
      .brand { gap: 7px; font-size: 11px; }

      };
      const cinematicName = CV.name.toUpperCase();
      const filledName = document.querySelector('[data-cinematic-name]');
      const outlineName = document.querySelector('[data-cinematic-outline]');
      const filledLetters = makeLetters(filledName, cinematicName);
      const outlineLetters = makeLetters(outlineName, cinematicName);
      const cinematicRole = document.querySelector('[data-cinematic-role]');
      cinematicRole.textContent = CV.role;
      document.querySelector('[data-cinematic-ul]').textContent = CV.initials;

      const splitHeading = (heading) => {
        const words = heading.textContent.trim().split(/\s+/);
        heading.innerHTML = words.map((word) => `<span class="word-mask"><span class="word-inner">${escapeHtml(word)}</span></span>`).join(' ');
      };
      document.querySelectorAll('.section-heading h2').forEach(splitHeading);

      const aboutParagraph = document.querySelector('[data-about] p');
      const aboutWords = aboutParagraph.textContent.trim().split(/\s+/);
      aboutParagraph.textContent = '';
      const measuringWords = aboutWords.map((word) => {
        const span = document.createElement('span');
        span.textContent = word;
        span.style.display = 'inline-block';
        span.style.marginRight = '.25em';
        aboutParagraph.append(span);
        return span;
      });
      const measuredLines = [];
      measuringWords.forEach((word) => {
        const top = Math.round(word.getBoundingClientRect().top);
        let line = measuredLines[measuredLines.length - 1];
        if (!line || line.top !== top) {
          line = { top, words: [] };
          measuredLines.push(line);
        }
        line.words.push(word.textContent);
      });
      aboutParagraph.innerHTML = measuredLines.map((line) => `<span class="line-mask"><span class="line-inner">${line.words.map(escapeHtml).join(' ')}</span></span> `).join('');

      gsap.set(filledLetters, { yPercent: 115, opacity: 0 });
      gsap.set(outlineName, { opacity: 0 });
      gsap.set('.cinematic-wipe', { scale: 0, opacity: 0 });
      gsap.set(document.querySelector('.cinematic-role'), { y: 12, opacity: 0 });
      gsap.set(document.querySelector('.cinematic-scroll'), { y: 8, opacity: 0 });
      gsap.set(document.querySelector('[data-initials]'), { opacity: 0 });

      // The opening title reveals on load; the pinned timeline scrubs the later stages.
      gsap.timeline()
        .to(filledLetters, { yPercent: 0, opacity: 1, duration: .9, stagger: .045, ease: 'power4.out' })
        .to(cinematicRole, { y: 0, opacity: 1, duration: .6, ease: 'power2.out' }, '-=.35')
        .to(document.querySelector('.cinematic-scroll'), { y: 0, opacity: 1, duration: .5, ease: 'power2.out' }, '-=.2');

      const hero = document.querySelector('.hero');
      const logo = document.querySelector('[data-initials]');
      const logoCenter = () => {
        const logoRect = logo.getBoundingClientRect();
        return { x: logoRect.left + logoRect.width / 2 - window.innerWidth / 2, y: logoRect.top + logoRect.height / 2 - window.innerHeight / 2 };
      };
      const letterSpread = () => window.matchMedia('(max-width: 700px)').matches ? 5 : 12;
      const nameCenter = (filledLetters.length - 1) / 2;
      const cinematicScrollDistance = window.matchMedia('(max-width: 700px)').matches ? 1.15 : 1.65;
      // Keep the same cinematic effect, but compress the scroll travel to roughly a 2-second sequence.
      const cinematicTimeline = gsap.timeline({
        scrollTrigger: {
          trigger: hero,
          start: () => `top top+=${document.querySelector('.site-header').offsetHeight}`,
          end: () => `+=${window.innerHeight * cinematicScrollDistance}`,
          scrub: 1,
          pin: true,
          anticipatePin: 1,
          invalidateOnRefresh: true
        }
      });

      cinematicTimeline
        .to('.hero-inner', { opacity: 0, duration: .2 }, 0)
        .to('.cinematic-scroll', { opacity: 0, y: 14, duration: .2 }, .45)
        .to(filledName, { opacity: 0, duration: .35 }, .8)
        .to(outlineName, { opacity: 1, duration: .35 }, .8)
        .to(filledLetters, { x: (index) => (index - nameCenter) * letterSpread(), scale: 1.12, duration: .45, stagger: .018, ease: 'power2.inOut' }, .8)
        .to(outlineLetters, { x: (index) => (index - nameCenter) * letterSpread(), scale: 1.12, duration: .45, stagger: .018, ease: 'power2.inOut' }, .8)
        .to(cinematicRole, { y: -42, opacity: 0, duration: .3, ease: 'power2.in' }, .9)
        .to('.cinematic-glow', { scale: 1.35, opacity: .9, duration: .55, ease: 'power1.out' }, 1.05)
        .to(outlineLetters, { x: 0, scale: 1, duration: .3, stagger: .01, ease: 'power2.inOut' }, 1.45)
        .to('.cinematic-name-wrap', { x: () => logoCenter().x, y: () => logoCenter().y, scale: .13, duration: .8, ease: 'power2.inOut' }, 1.5)
        .to('.cinematic-wipe', { scale: 1, opacity: 1, duration: 1.1, ease: 'power1.inOut' }, 1.45)
        .to(outlineName, { opacity: 0, duration: .2 }, 1.8)
        .set('[data-cinematic-ul]', { xPercent: -50, yPercent: -50 }, 1.8)
        .to('[data-cinematic-ul]', { x: () => logo.getBoundingClientRect().left + logo.offsetWidth / 2, y: () => logo.getBoundingClientRect().top + logo.offsetHeight / 2, opacity: 1, duration: .2 }, 1.8)
        .to(logo, { opacity: 1, duration: .18 }, 1.85)
        .to('.hero-inner', { opacity: 1, duration: .5, ease: 'power1.out' }, 1.7)
        .to('.cinematic-glow', { opacity: 0, duration: .25 }, 1.9)
        .to('.cinematic-wipe', { opacity: 0, duration: .35 }, 1.95)
        .to('.hero-cinematic', { autoAlpha: 0, duration: .2 }, 1.95);

      const headingWords = gsap.utils.toArray('.section-heading .word-inner');
      gsap.set(headingWords, { yPercent: 115, opacity: 0 });
      ScrollTrigger.batch(headingWords, {
        start: 'top 84%',
        once: true,
        onEnter: (batch) => gsap.to(batch, { yPercent: 0, opacity: 1, duration: .7, stagger: .055, ease: 'power3.out', overwrite: true })
      });

      const aboutLines = gsap.utils.toArray('.line-inner');
      gsap.set(aboutLines, { yPercent: 110, opacity: 0 });
      ScrollTrigger.batch(aboutLines, {
        start: 'top 86%',
        once: true,
        onEnter: (batch) => gsap.to(batch, { yPercent: 0, opacity: 1, duration: .7, stagger: .08, ease: 'power3.out', overwrite: true })
      });

      const cards = gsap.utils.toArray('.skill-card, .project-card, .timeline-item');
      gsap.set(cards, { y: 26, opacity: 0 });
      ScrollTrigger.batch(cards, {
        start: 'top 88%',
        once: true,
        batchMax: 4,
        onEnter: (batch) => gsap.to(batch, { y: 0, opacity: 1, duration: .65, stagger: .1, ease: 'power3.out', overwrite: true })
      });

      const otherReveals = gsap.utils.toArray('.reveal:not(.skill-card):not(.project-card):not(.timeline-item)');
      gsap.set(otherReveals, { y: 22, opacity: 0 });
      ScrollTrigger.batch(otherReveals, {
        start: 'top 88%',
        once: true,
        onEnter: (batch) => gsap.to(batch, { y: 0, opacity: 1, duration: .7, stagger: .08, ease: 'power3.out', overwrite: true })
      });

      document.querySelectorAll('.timeline').forEach((timeline) => {
        gsap.to(timeline.querySelector('.timeline-progress-line'), {
          scaleY: 1,
          ease: 'none',
          scrollTrigger: { trigger: timeline, start: 'top 76%', end: 'bottom 58%', scrub: true }
        });
      });

      gsap.to('.scroll-progress', { scaleX: 1, ease: 'none', scrollTrigger: { trigger: document.documentElement, start: 'top top', end: 'bottom bottom', scrub: true } });
      gsap.to('.orbit-square.one', { y: -70, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: 1 } });
      gsap.to('.orbit-square.two', { y: 85, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: 1 } });
      gsap.to('.orbit-ring', { y: -45, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: 1 } });

      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const dot = document.querySelector('.cursor-dot');
        const ring = document.querySelector('.cursor-ring');
        const updateCursorVisibility = () => document.body.classList.toggle('custom-cursor-enabled', window.innerWidth > 700 && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
        updateCursorVisibility();
        window.addEventListener('resize', updateCursorVisibility, { passive: true });
        gsap.set([dot, ring], { xPercent: -50, yPercent: -50 });
        const moveDotX = gsap.quickTo(dot, 'x', { duration: .12, ease: 'power2.out' });
        const moveDotY = gsap.quickTo(dot, 'y', { duration: .12, ease: 'power2.out' });
        const moveRingX = gsap.quickTo(ring, 'x', { duration: .3, ease: 'power2.out' });
        const moveRingY = gsap.quickTo(ring, 'y', { duration: .3, ease: 'power2.out' });
        window.addEventListener('pointermove', (event) => {
          moveDotX(event.clientX); moveDotY(event.clientY);
          moveRingX(event.clientX); moveRingY(event.clientY);
        });
        document.querySelectorAll('a, button').forEach((interactive) => {
          interactive.addEventListener('pointerenter', () => gsap.to(ring, { scale: 1.7, borderColor: 'rgba(20,184,166,.9)', duration: .25 }));
          interactive.addEventListener('pointerleave', () => gsap.to(ring, { scale: 1, borderColor: 'rgba(59,130,246,.7)', duration: .25 }));
        });
        document.querySelectorAll('.hero-actions .button').forEach((button) => {
          const xTo = gsap.quickTo(button, 'x', { duration: .35, ease: 'power3.out' });
          const yTo = gsap.quickTo(button, 'y', { duration: .35, ease: 'power3.out' });
          button.classList.add('cinematic-button');
          button.addEventListener('pointermove', (event) => {
            const bounds = button.getBoundingClientRect();
            xTo((event.clientX - bounds.left - bounds.width / 2) * .12);
            yTo((event.clientY - bounds.top - bounds.height / 2) * .16);
          });
          button.addEventListener('pointerleave', () => { xTo(0); yTo(0); });
        });
      }

      requestAnimationFrame(() => ScrollTrigger.refresh());
    }

    document.querySelector('[data-contact-form]').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const subject = `Portfolio message from ${form.get('name')}`;
      const body = `Name: ${form.get('name')}\nEmail: ${form.get('email')}\n\n${form.get('message')}`;
      window.location.href = `mailto:${CV.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>
</body>
</html>
